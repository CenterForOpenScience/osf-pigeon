name: osf-pigeon

on: [push, pull_request]

jobs:
  test-pigeon:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: |
        pip install -r dev.txt
        flake8 .
        python -m pytest .

